<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro - Banco Digital</title>

        <style>
            body {
                font-family: Arial;
                background-color: #1e1e2f;
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .container {
                text-align: center;
                background: #2a2a40;
                padding: 30px;
                border-radius: 10px;
                width: 300px;
            }

            input {
                width: 100%;
                padding: 8px;
                margin: 5px 0;
                border-radius: 5px;
                border: none;
            }

            button {
                width: 100%;
                padding: 10px;
                background: #4CAF50;
                border: none;
                border-radius: 5px;
                color: white;
                font-weight: bold;
                cursor: pointer;
            }

            button:hover {
                background: #45a049;
            }

            .msg {
                margin-top: 10px;
                font-size: 14px;
            }
        </style>
    </head>

    <body>

        <div class="container">
            <h2>Cadastrar Conta</h2>

            <input type="text" id="nome" placeholder="Nome completo">
            <input type="text" id="cpf" placeholder="CPF">
            <input type="password" id="senha" placeholder="Senha">
            <input type="password" id="senha4" placeholder="Senha 4 dígitos">

            <button onclick="cadastrar()">Cadastrar-se</button>
            <br>
            <button onclick="voltar()">Voltar para a tela inicial</button>

            <div class="msg" id="mensagem"></div>
        </div>

        <script>
            function voltar() {
                window.location.href = "index.html";
            }
            function cadastrar() {

                const nome = document.getElementById("nome").value;
                const cpf = document.getElementById("cpf").value;
                const senha = document.getElementById("senha").value;
                const senha4 = document.getElementById("senha4").value;

                fetch("/cadastro", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: nome,
                        cpf: cpf,
                        senha: senha,
                        senha4: senha4
                    })
                })
                        .then(response => response.json())
                        .then(data => {

                            const msg = document.getElementById("mensagem");

                            if (data.status === "ok") {
                                msg.style.color = "lightgreen";
                                msg.innerText = "Cadastro realizado com sucesso!";
                            } else {
                                msg.style.color = "red";
                                msg.innerText = data.msg || "Erro no cadastro";
                            }

                        })
                        .catch(error => {
                            console.error("Erro:", error);
                            document.getElementById("mensagem").innerText = "Erro de conexão com servidor";
                        });
            }
        </script>

    </body>
</html>
